<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>INOVAP - Ecossistema de Inovação</title>
  <link rel="icon" type="image/png"
    href="https://jmhquynjyekclwxjgupk.supabase.co/storage/v1/object/public/logotipos/logotipos/2.png" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script>
    function applyTheme() {
      if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
    }
    applyTheme();
  </script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      height: 100%;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .light {
      --bg-primary: #ffffff;
      --bg-surface: #f8fafc;
      --bg-elevated: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-subtle: rgba(0, 0, 0, 0.04);
      --border-normal: rgba(0, 0, 0, 0.08);
      --brand-accent: #059669;
    }

    .dark {
      --bg-primary: #0a0a0a;
      --bg-surface: #121212;
      --bg-elevated: #1a1a1a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-normal: rgba(255, 255, 255, 0.08);
      --brand-accent: #00dc82;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    /* Custom Scrollbar UI3.0 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .dark ::-webkit-scrollbar-track {
      background: transparent;
    }

    .light ::-webkit-scrollbar-track {
      background: transparent;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 10px;
    }

    .light ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-accent);
    }

    .prose h1 {
      font-size: 2.25em !important;
      font-weight: 800 !important;
      margin-bottom: 0.8em;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .prose h2 {
      font-size: 1.8em !important;
      font-weight: 700 !important;
      margin-top: 1.5em;
      margin-bottom: 0.6em;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .prose p {
      margin-bottom: 1.2em;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .dark .prose h1,
    .dark .prose h2,
    .dark .prose h3,
    .dark .prose h4 {
      color: white !important;
    }

    .light .prose h1,
    .light .prose h2,
    .light .prose h3,
    .light .prose h4 {
      color: #0f172a !important;
    }

    .dark .prose p,
    .dark .prose ul,
    .dark .prose ol {
      color: #94a3b8;
    }

    .light .prose p,
    .light .prose ul,
    .light .prose ol {
      color: #475569;
    }

    /* UI3.0 Card Style */
    .ui-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 2rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ui-card:hover {
      border-color: var(--border-normal);
    }

    /* Transitions */
    .page-transition {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#0a0a0a',
              surface: '#121212',
              elevated: '#1a1a1a',
              glass: 'rgba(255, 255, 255, 0.02)',
              glassHover: 'rgba(255, 255, 255, 0.05)',
              border: 'rgba(255, 255, 255, 0.06)',
              lightBorder: 'rgba(0, 0, 0, 0.05)',
              green: '#059669',
              neon: '#00dc82',
              darkGreen: '#047857',
            }
          },
          borderRadius: {
            '3xl': '1.5rem',
            '4xl': '2rem',
            '5xl': '2.5rem',
          },
          boxShadow: {
            'subtle': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'neon': '0 0 20px rgba(0, 255, 157, 0.15)',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 8s ease-in-out infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(15px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-15px)' },
            }
          }
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite-plugin-pwa": "https://esm.sh/vite-plugin-pwa@^1.2.0",
    "html5-qrcode": "https://esm.sh/html5-qrcode@^2.3.8",
    "react-qr-code": "https://esm.sh/react-qr-code@^2.0.18"
  }
}
</script>
</head>

<body class="bg-white dark:bg-black transition-colors duration-300">
  <div id="root" class="h-full"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
